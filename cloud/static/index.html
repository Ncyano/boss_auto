<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BOSS 采集云端</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--line:#d8dee6;--txt:#1f2430;--muted:#6b7684;--acc:#1f7ae0;--ok:#12915b;--bad:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 "Microsoft YaHei UI","PingFang SC",sans-serif;background:var(--bg);color:var(--txt)}
  header{background:#1e2430;color:#fff;padding:16px 24px}
  header h1{margin:0;font-size:18px}
  header span{color:#8fa2b8;font-size:12px;margin-left:8px}
  main{padding:20px 24px;display:grid;gap:16px;grid-template-columns:360px 1fr}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
  .card h2{margin:0 0 12px;font-size:14px;color:var(--acc)}
  label{display:block;margin:10px 0 4px;color:var(--muted);font-size:12px}
  input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
  button{margin-top:14px;width:100%;padding:10px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{background:#b9c6d6}
  button.ghost{background:#eef3f9;color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #eef1f5}
  th{color:var(--muted);font-weight:500;font-size:12px}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
  .t-ok{background:#e7f7ef;color:var(--ok)}
  .t-bad{background:#fdecec;color:var(--bad)}
  .bar{height:8px;background:#e6ebf2;border-radius:4px;overflow:hidden;margin:8px 0}
  .bar>i{display:block;height:100%;background:var(--acc);width:0}
  .muted{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>BOSS 采集云端 <span>云端识别 · 本地浏览器</span></h1>
</header>
<main>
  <section class="card">
    <h2>新建任务</h2>
    <label>招聘岗位</label>
    <select id="pos">
      <option>运营助理</option>
      <option>运营主管</option>
      <option>人事专员</option>
    </select>
    <label>目标人数</label>
    <input id="target" type="number" value="20" min="1">
    <label>间隔秒数（最小 / 最大）</label>
    <div style="display:flex;gap:8px">
      <input id="gmin" type="number" value="4" step="0.5">
      <input id="gmax" type="number" value="7" step="0.5">
    </div>
    <button id="create">创建任务</button>
    <div style="margin-top:12px" class="muted" id="agents">已连接代理：0</div>
  </section>

  <section class="card">
    <h2>任务列表</h2>
    <table>
      <thead><tr><th>ID</th><th>岗位</th><th>状态</th><th>进度</th><th>合适/不合适</th><th>操作</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="muted">还没有任务</td></tr></tbody>
    </table>
    <div id="detail" style="margin-top:16px"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let current = null;

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function createTask() {
  const body = {
    position: $("#pos").value,
    target: +$("#target").value,
    min_gap: +$("#gmin").value,
    max_gap: +$("#gmax").value,
  };
  const t = await api("/api/tasks", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  current = t.id;
  refresh();
}

async function startTask(id) { await api(`/api/tasks/${id}/start`, {method: "POST"}); refresh(); }
async function stopTask(id) { await api(`/api/tasks/${id}/stop`, {method: "POST"}); refresh(); }
function showDetail(id) { current = id; refresh(); }

async function refresh() {
  try {
    const agents = await api("/api/agents");
    $("#agents").textContent = `已连接代理：${agents.length}` +
      (agents.length ? `（${agents.map(a => a.id).join(", ")}）` : " —— 请先在人事电脑启动代理");
  } catch (e) {}

  let tasks = [];
  try { tasks = await api("/api/tasks"); } catch (e) {}

  const rows = $("#rows");
  if (!tasks.length) {
    rows.innerHTML = '<tr><td colspan="6" class="muted">还没有任务</td></tr>';
  } else {
    rows.innerHTML = tasks.map(t => {
      const pct = t.target ? Math.min(100, Math.round(t.handled / t.target * 100)) : 0;
      const btn = t.status === "running"
        ? `<button class="ghost" onclick="stopTask('${t.id}')">停止</button>`
        : `<button class="ghost" onclick="startTask('${t.id}')">开始</button>`;
      return `<tr>
        <td><a href="#" onclick="showDetail('${t.id}');return false">${t.id}</a></td>
        <td>${t.position}</td><td>${t.status}${t.error ? '<br><span class="t-bad">'+t.error+'</span>' : ''}</td>
        <td style="min-width:140px"><div class="bar"><i style="width:${pct}%"></i></div>
            <span class="muted">${t.handled}/${t.target}</span></td>
        <td><span class="tag t-ok">${t.valid}</span> / <span class="tag t-bad">${t.rejected}</span></td>
        <td>${btn} <a href="/api/tasks/${t.id}.csv">CSV</a></td>
      </tr>`;
    }).join("");
  }

  if (current) {
    try {
      const t = await api(`/api/tasks/${current}`);
      const list = (t.results || []).slice(-30).reverse();
      $("#detail").innerHTML = `<h2>任务 ${t.id} 明细（最近 ${list.length} 条）</h2>` +
        `<table><thead><tr><th>姓名</th><th>结论</th><th>处理状态</th><th>原因</th></tr></thead><tbody>` +
        list.map(r => `<tr><td>${r.name}</td>
          <td><span class="tag ${r.verdict === '合适' ? 't-ok' : 't-bad'}">${r.verdict || '-'}</span></td>
          <td>${r.status || '-'}</td><td class="muted">${(r.reason || '').slice(0, 60)}</td></tr>`).join("") +
        `</tbody></table>`;
    } catch (e) { $("#detail").textContent = e.message; }
  }
}

$("#create").onclick = createTask;
setInterval(refresh, 3000);
refresh();
</script>
</body>
</html>
